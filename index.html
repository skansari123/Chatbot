<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicious Bites Chatbot</title>
    <style>
        /* 1. Chat Icon (Gol Button) Ka Design */
        #db-chat-icon {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #4f46e5; /* Indigo color */
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 9999;
            transition: transform 0.2s;
        }
        #db-chat-icon:hover {
            transform: scale(1.1);
        }

        /* 2. Main Chat Box Ka Design */
        #db-chat-box {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 330px;
            height: 450px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            display: none; /* Shuruat me chhupa rahega */
            flex-direction: column;
            overflow: hidden;
            z-index: 9999;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Header (Upar ki पट्टी) */
        #db-chat-header {
            background: #4f46e5;
            color: white;
            padding: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #db-chat-close {
            cursor: pointer;
            font-size: 22px;
        }

        /* Messages Area (Jahan baatein hongi) */
        #db-chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .db-msg {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 80%;
            font-size: 14px;
            line-height: 1.4;
        }
        .db-user {
            background: #4f46e5;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }
        .db-bot {
            background: #e2e8f0;
            color: #1e293b;
            align-self: flex-start;
            border-bottom-left-radius: 0;
        }

        /* Input Area (Niche typing waali jagah) */
        #db-chat-input-area {
            display: flex;
            border-top: 1px solid #e2e8f0;
            padding: 10px;
            background: white;
        }
        #db-chat-input {
            flex: 1;
            border: 1px solid #cbd5e1;
            padding: 10px;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }
        #db-chat-send {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 0 16px;
            margin-left: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- ─── CHATBOT FRONTEND ELEMENTS ─── -->
    <!-- 1. Chat Icon -->
    <div id="db-chat-icon" onclick="toggleChat()">💬</div>

    <!-- 2. Chat Window -->
    <div id="db-chat-box">
        <div id="db-chat-header">
            <span>🍕 Delicious Bites AI</span>
            <span id="db-chat-close" onclick="toggleChat()">&times;</span>
        </div>
        <div id="db-chat-messages">
            <div class="db-msg db-bot">Hello! Welcome to Delicious Bites. Main aapki kya help kar sakta hoon? 😊</div>
        </div>
        <div id="db-chat-input-area">
            <input type="text" id="db-chat-input" placeholder="Ask about menu, offers...">
            <button id="db-chat-send" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- ─── JAVASCRIPT LOGIC ─── -->
    <script>
        // Chatbox ko kholne aur band karne ka function
        function toggleChat() {
            const chatBox = document.getElementById('db-chat-box');
            if (chatBox.style.display === 'flex') {
                chatBox.style.display = 'none';
            } else {
                chatBox.style.display = 'flex';
            }
        }

        // Message send karne aur Val Town (Backend) se reply laane ka function
        async function sendMessage() {
            const chatInput = document.getElementById('db-chat-input');
            const chatMessages = document.getElementById('db-chat-messages');
            const text = chatInput.value.trim();
            
            if (!text) return;

            // 1. User ka message screen par dikhao
            appendMessage(text, 'db-user');
            chatInput.value = '';

            // 2. Loading status dikhao
            const loader = appendMessage('Typing...', 'db-bot');

            try {
                // 3. Val Town Backend ko Request bhejo
                // **YAHAN APNA VAL TOWN HTTP ENDPOINT LINK DAALEIN**
                const response = await fetch("https://YOUR_VAL_TOWN_URL.web.val.run", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                
                // Loader hatao aur asli AI reply dikhao
                loader.remove();
                appendMessage(data.reply, 'db-bot');
            } catch (error) {
                loader.remove();
                appendMessage("Sorry, network issue hai. Please try again!", 'db-bot');
            }
        }

        // Screen par naya message add karne ka helper function
        function appendMessage(text, className) {
            const chatMessages = document.getElementById('db-chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `db-msg ${className}`;
            msgDiv.innerText = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight; // Auto-scroll to bottom
            return msgDiv;
        }

        // Enter key press karne par bhi message send ho jaye
        document.getElementById('db-chat-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
