<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Support AI</title>
    <style>
        :root { --primary: #2563eb; --hover: #16a34a; --bg: #f3f4f6; }
        * { box-sizing: border-box; font-family: sans-serif; }
        
        /* Chat Icon Design */
        #db-chat-icon {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--primary);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 99999;
            transition: transform 0.2s;
        }
        #db-chat-icon:hover {
            transform: scale(1.1);
        }

        /* Fixed Container Style */
        .app-container { 
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 330px; 
            height: 450px; /* Fixed height de di taaki poora khule */
            background: white; 
            display: none; /* Shuruat me hidden */
            flex-direction: column; 
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            overflow: hidden;
            z-index: 99999;
        }
        
        header { padding: 15px 20px; background: var(--primary); color: white; display: flex; justify-content: space-between; align-items: center; }
        
        .clear-btn { background: #1d4ed8; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; transition: background 0.3s ease; }
        .clear-btn:hover { background: var(--hover); }
        .send-btn { border-radius:50%; border:none; background:var(--primary); color:white; width:40px; height:40px; cursor:pointer; transition: background 0.3s ease; }
        .send-btn:hover { background: var(--hover); }
        
        .chat-area { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background: #f8fafc; }
        .msg { padding: 12px 16px; border-radius: 15px; max-width: 80%; font-size: 0.9rem; line-height: 1.4; }
        .bot { background: #e5e7eb; align-self: flex-start; border-bottom-left-radius: 0; color: #1e293b; }
        .user { background: var(--primary); color: white; align-self: flex-end; border-bottom-right-radius: 0; }
        
        /* Wave Animation */
        @keyframes wave {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .wave-dot { display: inline-block; width: 6px; height: 6px; background: #888; border-radius: 50%; margin: 0 2px; animation: wave 0.6s infinite; }
        .wave-dot:nth-child(2) { animation-delay: 0.2s; }
        .wave-dot:nth-child(3) { animation-delay: 0.4s; }

        .input-area { padding: 15px; border-top: 1px solid #eee; display: flex; gap: 10px; background: white; }
        input { flex-grow: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; font-size: 14px; }
    </style>
</head>
<body>

<div id="db-chat-icon" onclick="toggleChat()">💬</div>

<div class="app-container" id="db-chat-box">
    <header>
        <strong>Business Bot</strong>
        <div style="display: flex; gap: 10px; align-items: center;">
            <button class="clear-btn" onclick="clearChat()">Clear Chat</button>
            <span style="cursor:pointer; font-size:24px; font-weight:bold; line-height:0;" onclick="toggleChat()">&times;</span>
        </div>
    </header>
    <div class="chat-area" id="chat-box">
        <div class="msg bot">Hello! How can I help you?</div>
    </div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Ask something...">
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
</div>

<script>
    const BACKEND = "https://sarifeen272--acaf97cc62f811f1828a1607ee4eb77e.web.val.run";
    
    function toggleChat() {
        const box = document.getElementById('db-chat-box');
        if (box.style.display === 'none' || box.style.display === '') {
            box.style.display = 'flex';
        } else {
            box.style.display = 'none';
        }
    }

    function clearChat() { 
        document.getElementById('chat-box').innerHTML = '<div class="msg bot">Chat cleared. How can I help?</div>'; 
    }
    
    async function sendMessage() {
        const input = document.getElementById('user-input');
        const box = document.getElementById('chat-box');
        if(!input.value.trim()) return;
        
        box.innerHTML += `<div class="msg user">${input.value}</div>`;
        const msg = input.value;
        input.value = "";
        box.scrollTop = box.scrollHeight;
        
        const waveDiv = document.createElement('div');
        waveDiv.className = 'msg bot';
        waveDiv.innerHTML = '<span class="wave-dot"></span><span class="wave-dot"></span><span class="wave-dot"></span>';
        box.appendChild(waveDiv);
        box.scrollTop = box.scrollHeight;
        
        try {
            const res = await fetch(`${BACKEND}/chat`, { 
                method: 'POST', 
                body: JSON.stringify({ message: msg }), 
                headers:{'Content-Type':'application/json'}
            });
            const data = await res.json();
            box.removeChild(waveDiv);
            box.innerHTML += `<div class="msg bot">${data.reply}</div>`;
        } catch(err) {
            box.removeChild(waveDiv);
            box.innerHTML += `<div class="msg bot">Sorry, network issue hai. Please try again!</div>`;
        }
        box.scrollTop = box.scrollHeight;
    }

    document.getElementById('user-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
